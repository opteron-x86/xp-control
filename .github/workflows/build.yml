name: Build and test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xp-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Linux sanitizer tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build
      - name: Configure and build
        env:
          CXX: g++-14
        run: |
          cmake --preset native-tests
          cmake --build --preset native-tests
      - name: Run tests
        run: ctest --preset native-tests --verbose

  windows:
    name: Windows DLL and archive
    needs: native
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out pinned vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: microsoft/vcpkg
          ref: ee12231b20c95013c6638d845d04c91559a1d1ff
          path: .deps/vcpkg
          persist-credentials: false
      - name: Configure Windows compiler
        run: ./.github/scripts/windows-env.ps1
      - name: Cache dependency binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .deps/binary-cache
          key: xp-control-vcpkg-windows-2025-${{ hashFiles('vcpkg.json') }}
      - name: Bootstrap vcpkg
        run: ./.deps/vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Configure
        run: cmake --preset windows-release
      - name: Build
        run: cmake --build --preset windows-release
      - name: Run Windows tests
        run: ctest --test-dir build/windows-release --verbose
      - name: Package DLL and debug symbols
        run: python tools/package.py --build build/windows-release --output dist
      - name: Upload installable archive and symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xp-control-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
